# Mirrors validatePassword in zrok's controller/util.go. Set password_rules_strict
# to false to warn instead of fail, where zrok itself does not enforce the rules.
- name: Check the password against zrok's rules
  ansible.builtin.set_fact:
    password_meets_rules: >-
      {{ account_password | length >= 8
         and account_password is regex('[A-Z]')
         and account_password is regex('[0-9]')
         and account_password is regex('[!@#$%^&*()_+\-=\[\]{};'':"\\|,.<>]') }}
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Stop on a password zrok will reject
  ansible.builtin.fail:
    msg: >-
      zrok rejects this password. It needs at least 8 characters, a capital letter,
      a number and a special character from !@#$%^&*()_+-=[]{};':"\|,.<>
  when:
    - not password_meets_rules | bool
    - password_rules_strict | default(true) | bool
  run_once: true

- name: Warn about a weak password
  ansible.builtin.debug:
    msg: >-
      WARNING: this password does not meet zrok's rules (8+ characters, a capital
      letter, a number and a special character). It is accepted here, but changing
      it later in the web console will require those rules.
  when:
    - not password_meets_rules | bool
    - not password_rules_strict | default(true) | bool
  run_once: true
