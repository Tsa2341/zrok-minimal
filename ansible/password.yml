# Sets a new password for an existing account. The stack sends no email, so the
# web console's "Forgot Password?" cannot work; this is the reset path.
- name: Reset a zrok account password
  hosts: zrok
  gather_facts: false
  vars_prompt:
    - name: account_email
      prompt: Account email
      private: false
    - name: account_password
      prompt: New password
      private: true
      confirm: true
  tasks:
    # zrok rejects passwords that break these rules when updating one.
    - name: Check the password meets zrok's rules
      ansible.builtin.include_tasks: tasks/password-rules.yml

    - name: Look up the account
      ansible.builtin.include_tasks: tasks/admin-api.yml

    - name: Stop when there is no such account
      ansible.builtin.fail:
        msg: "No account exists for {{ account_email }}. Create one with account.yml."
      when: not account_exists | bool

    - name: Set the new password
      ansible.builtin.uri:
        url: "{{ zrok_api }}/account"
        method: PATCH
        headers: "{{ zrok_api_headers }}"
        body_format: json
        body: { email: "{{ account_email }}", password: "{{ account_password }}" }
        status_code: [200, 422]
      register: reset
      delegate_to: localhost
      no_log: true

    - name: Report a rejected password
      ansible.builtin.fail:
        msg: "zrok rejected the password: {{ reset.json | default('validation failed') }}"
      when: reset.status == 422

    - name: Done
      ansible.builtin.debug:
        msg: "Password updated for {{ account_email }}. Log in at https://zrok2.{{ zrok_dns_zone }}"
